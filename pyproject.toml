[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sre-agent-mcp"
version = "0.1.0"
description = "A Python SRE agent foundation with guarded tools and a local event workbench."
requires-python = ">=3.12"
dependencies = [
  "mcp>=2.2.0,<3",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.8,<3",
  "python-dotenv>=1,<2",
  "openai>=1,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.9,<1",
]

[project.scripts]
sre-agent-web = "web_app:main"

[tool.hatch.build.targets.wheel]
only-include = [
  "src/agent",
  "src/config",
  "src/database",
  "src/model",
  "src/scripts",
  "src/tools",
  "src/main.py",
  "src/web_app.py",
]
sources = ["src"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
